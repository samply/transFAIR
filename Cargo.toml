[package]
name = "transfair"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
axum = { version = "0.8.1", features = ["macros"] }
chrono = { version = "0.4.37", default-features = false, features = ["serde", "now"] }
clap = { version = "4.5.3", features = ["env", "derive"] }
fhir-sdk = { version = "0.16", default-features = false, features = ["builders", "r4b"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13.1", features = ["json", "rustls", "form", "query"], default-features = false }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid"] }
thiserror = "2"
tokio = { version = "1.36.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[build-dependencies]
build-data = "0.3.3"

[dev-dependencies]
pretty_assertions = "1.4.1"

# TODO: Remove once sqlx > 0.9.0 is released. sqlx 0.9.0 caps libsqlite3-sys
# below 0.38, which keeps us on a bundled SQLite affected by RUSTSEC-2026-0459.
# This commit on sqlx main allows libsqlite3-sys 0.39.x (launchbadge/sqlx#4502).
[patch.crates-io]
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
